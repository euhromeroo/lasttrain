<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Trem</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loading">
        <div class="loading-title">ÚLTIMO TREM</div>
        <div class="loading-text">Carregando estação...</div>
    </div>

    <div id="game">

        <div id="crosshair">+</div>

        <div id="hud">

            <div class="top-left">
                <div class="game-title">ÚLTIMO TREM</div>
                <div id="location">ESTAÇÃO CENTRAL</div>
            </div>

            <div class="top-right">
                <div>❤️ <span id="lives">3</span></div>
                <div>⚡ <span id="energy">100</span></div>
            </div>

            <div id="mission-box">
                <div class="mission-title">MISSÃO ATUAL</div>
                <div id="mission">
                    Descubra onde você está.
                </div>
            </div>

            <div id="interaction">
                Pressione <b>E</b> para interagir
            </div>

            <div id="notification"></div>

        </div>

        <div id="dialogue">

            <div class="dialogue-name" id="dialogue-name">
                Olivia
            </div>

            <div class="dialogue-text" id="dialogue-text">
            </div>

            <button id="dialogue-next">
                Continuar
            </button>

        </div>

        <div id="inventory">

            <div class="inventory-title">
                INVENTÁRIO
            </div>

            <div id="items">
                Nenhum item encontrado.
            </div>

            <button id="close-inventory">
                Fechar
            </button>

        </div>

        <div id="controls">
            <div>W A S D — mover</div>
            <div>Mouse — olhar</div>
            <div>E — interagir</div>
            <div>I — inventário</div>
        </div>

    </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module" src="script.js"></script>

</body>
</html>
