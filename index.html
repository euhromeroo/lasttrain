<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Número Desconhecido</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <section id="startScreen" class="screen start-screen">

        <div class="start-content">

            <div class="mystery-icon">
                ?
            </div>

            <h1>NÚMERO<br>DESCONHECIDO</h1>

            <p class="subtitle">
                Algumas mensagens<br>
                deveriam permanecer sem resposta.
            </p>

            <button id="startButton" class="main-button">
                INICIAR JOGO
            </button>

            <p class="start-info">
                Uma história de escolhas e mistério
            </p>

        </div>

    </section>


    <!-- =========================
         JOGO
    ========================== -->

    <main id="gameScreen" class="game-screen hidden">

        <div class="phone">

            <!-- STATUS BAR -->

            <header class="status-bar">

                <span id="clock">23:41</span>

                <div class="status-icons">

                    <span class="signal">
                        ▮▮▮
                    </span>

                    <span class="wifi">
                        ◔
                    </span>

                    <span class="battery">
                        <span id="batteryLevel"></span>
                    </span>

                </div>

            </header>


            <!-- CABEÇALHO DA CONVERSA -->

            <div class="chat-header">

                <div class="back-button">
                    ‹
                </div>

                <div class="contact-info">

                    <div class="contact-avatar">
                        ?
                    </div>

                    <div>
                        <h2>Número Desconhecido</h2>
                        <span id="onlineStatus">
                            desconhecido
                        </span>
                    </div>

                </div>

                <div class="header-icons">
                    ⋮
                </div>

            </div>


            <!-- ÁREA DA CONVERSA -->

            <section id="chat" class="chat">

                <div class="date-divider">
                    HOJE
                </div>

            </section>


            <!-- ÁREA DAS ESCOLHAS -->

            <section id="choices" class="choices hidden">

                <p class="choice-title">
                    Escolha sua resposta:
                </p>

                <div id="choiceButtons"></div>

            </section>


            <!-- ÁREA INFERIOR -->

            <footer class="message-bar">

                <div class="message-input">
                    <span>Mensagem</span>
                </div>

                <button class="send-button">
                    ➤
                </button>

            </footer>

        </div>

    </main>


    <!-- =========================
         TELA FINAL
    ========================== -->

    <section id="endScreen" class="screen end-screen hidden">

        <div class="end-content">

            <div class="end-icon">
                ?
            </div>

            <h1 id="endTitle">
                FIM
            </h1>

            <p id="endText">
                Sua história terminou.
            </p>

            <button id="restartButton" class="main-button">
                JOGAR NOVAMENTE
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
